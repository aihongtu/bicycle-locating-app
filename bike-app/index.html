<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自行车定位助手</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="phone">
    <div class="splash"></div>
    <div class="topbar">
      <span id="app-title"><span class="brand-line"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="m6 16 4-8 4 8H6m4-8h4m1-3h3"/></svg>自行车定位助手</span></span>
      <span class="topbar-right"><span class="topbar-sub">本地版 v1</span><button id="theme-toggle" class="theme-toggle" title="切换深色/浅色模式" aria-label="切换深色/浅色模式"></button></span>
    </div>
    <div id="toast-box"></div>
    <div class="screen">
      <div class="deco deco-tl"></div>
      <div class="deco deco-tr"></div>
      <div class="deco deco-bl"></div>
      <div class="deco deco-br"></div>
      <div id="page-find"></div>
      <div id="page-ride"></div>
      <div id="page-people"></div>
      <div id="page-me"></div>
    </div>
    <div class="tabbar">
      <button id="tab-find" class="tab active"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></svg><span>找车</span></button>
      <button id="tab-ride" class="tab"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h3a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3h1"/></svg><span>骑行</span></button>
      <button id="tab-people" class="tab"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1H3Zm12-12a3 3 0 1 1 2.5 3M18 14a4 4 0 0 1 3 4v2h-3"/></svg><span>骑友</span></button>
      <button id="tab-me" class="tab"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>我的</span></button>
    </div>
  </div>

  <script src="js/amap-config.js"></script>
  <script src="js/amap-config.local.js"></script>
  <script src="js/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/services/sim-bike.js"></script>
  <script src="js/services/sim-nearby.js"></script>
  <script src="js/services/sim-device.js"></script>
  <script src="js/services/bluetooth.js"></script>
  <script src="js/services/gnss-serial.js"></script>
  <script src="js/state.js"></script>
  <script src="js/map-view.js"></script>
  <script src="js/map-provider.js"></script>
  <script src="js/map-engine.js"></script>
  <script src="js/amap-engine.js"></script>
  <script src="js/privacy.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/find.js"></script>
  <script src="js/pages/ride.js"></script>
  <script src="js/pages/people.js"></script>
  <script src="js/login.js"></script>
  <script src="js/pages/me.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
