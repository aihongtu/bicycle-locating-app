    <text x="92" y="847" fill="#6d7976" font-family="sans-serif" font-size="10">改为带明暗层次、发丝高光、服装结构与个人识别配件的角色档案肖像；不再使用字母或 emoji。</text>
    <text x="92" y="872" fill="#87918b" font-family="sans-serif" font-size="9">头像为原创矢量概念；仅供评审，头像选择与上传功能未改动。</text>
