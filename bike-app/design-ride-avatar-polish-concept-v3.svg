      <text x="436" y="265" fill="#6d7976" font-size="10" font-weight="700" letter-spacing="1">DURATION</text><text x="436" y="327" fill="#202727" font-family="Georgia,serif" font-size="39" font-weight="600">48</text><text x="436" y="353" fill="#748f1c" font-size="11" font-weight="700">min</text><text x="436" y="401" fill="#77837c" font-size="10">骑行时长</text>
      <text x="684" y="265" fill="#6d7976" font-size="10" font-weight="700" letter-spacing="1">AVG. SPEED</text><text x="684" y="327" fill="#202727" font-family="Georgia,serif" font-size="39" font-weight="600">0</text><text x="684" y="353" fill="#748f1c" font-size="11" font-weight="700">km/h</text><text x="684" y="401" fill="#77837c" font-size="10">平均速度</text>
