    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".97"/><stop offset=".55" stop-color="#f5f7f1"/><stop offset="1" stop-color="#e9eee9"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0dc"/><stop offset=".65" stop-color="#e6c9ac"/><stop offset="1" stop-color="#c99f83"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45534c"/><stop offset="1" stop-color="#202927"/></linearGradient>
