  <text x="64" y="66" fill="#75817a" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="3">P09 FIELD GLASS / CHARACTER PASS 03</text>
  <text x="64" y="112" fill="#202727" font-family="'Noto Serif SC','Microsoft YaHei',serif" font-size="29" font-weight="600">骑行数据与头像 · 角色档案肖像提案</text>
  <path d="M64 132h992" stroke="#aab7b0"/>
  <g filter="url(#shadow)">
