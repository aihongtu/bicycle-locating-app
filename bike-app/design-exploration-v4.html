{id:'day',name:'02 白昼测绘站',tag:'浅雾 / 深色控制台 / 清晰地图',module:'DAYLIGHT MAP DESK',title:'白昼测绘站',desc:'把截图里明亮场景与深色浮层的关系转成导航产品：浅色地图环境，深色操作条和信号色标记。更适合白天户外使用，地图信息可读，终端氛围保留在功能区。',code:'DMD-02',colors:['#e9ece8','#202727','#90b919','#159eae','#d8e0db'],points:['地图底色明亮，控制面板深色，形成前景/现场的空间层次。','车辆状态与用户定位用不同颜色编码，距离直接呈现。','轻量阴影只用于地图浮控，不让整页变成磨砂玻璃。']},
{id:'signal',name:'03 信号切片',tag:'青黑 / 荧光块面 / 斜切节奏',module:'SIGNAL / VECTOR-03',title:'信号切片',desc:'从参考图中活动横幅、青色信号块和彩色状态条提炼出来的高张力方向。明亮纸底承载内容，黑色功能条、青色和黄绿切片负责焦点；节奏更大胆但信息仍成组。',code:'SIG-03',colors:['#f2f1e8','#242829','#badd26','#21bdc5','#e24756'],points:['黑色横条和错位块面制造速度感，不给每个控件都加装饰。','青色用于连接/信息，黄绿用于车位/主要操作，红色只用于风险。','社交页与个人页同样使用功能条和斜切分区，确保系统统一。']},
{id:'dossier',name:'04 信标档案',tag:'白灰 / 圆环坐标 / 大数字',module:'BEACON DOSSIER',title:'信标档案',desc:'提取角色档案与环形读数的视觉语法，转成车辆与骑行数据档案。高对比黑白面板、圆形坐标环、大号数据、短刻度和编号形成精密感；少量黄绿标记状态。',code:'BD-04',colors:['#e7e5dc','#25292a','#b6d72b','#36bdc3','#cbd2c8'],points:['大数字与环形刻度承载距离、里程、速度等高价值数据。','资料页像设备档案，地图页仍优先显示实际位置，不堆 HUD。','亮色只表示选中、在线和关键动作，静态细节不持续发光。']}
];
const screens=[{id:'find',label:'找车',module:'LOCATE / SIGNAL'},{id:'ride',label:'骑行',module:'RIDE / RECORD'},{id:'friends',label:'骑友',module:'RIDER NETWORK'},{id:'me',label:'我的',module:'USER DOSSIER'}];let activeTheme='command',activeScreen='find',friendView='附近的人',recording=false;
function icon(k){const p={find:'<circle cx="12" cy="12" r="8"/><path d="m15 9-2 4-4 2 2-4z"/>',ride:'<path d="M4 19V5m0 14h16M7 15l4-4 3 2 5-6"/>',friends:'<circle cx="9" cy="8" r="3"/><path d="M3 20c.4-3.3 2.4-5 6-5s5.6 1.7 6 5m2-14a3 3 0 0 1 0 6m1 3c2 .5 3 2 3 4"/>',me:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-4 3-6 7-6s6.3 2 7 6"/>'};return '<svg viewBox="0 0 24 24" aria-hidden="true">'+p[k]+'</svg>'}
function map(){return '<div class="map"><div class="district d1"></div><div class="district d2"></div><div class="district d3"></div><span class="road-label rl1">桐荫街 / 04</span><span class="road-label rl2">北侧停车区</span><span class="road-label rl3">R-17</span><div class="route"></div><div class="you"></div><div class="pin"><span>+</span></div><div class="distance"><b>180</b> m　步行 3 分钟</div><div class="map-tools"><button data-action="刷新位置">↻</button><button data-action="定位车辆">⌖</button><button data-action="地图缩放">＋</button></div><div class="legend"><i>●</i> 车辆信标　<span style="color:var(--signal)">●</span> 我的位置</div></div>'}
function findView(){return '<div class="view"><div class="vehicle"><div class="bike-badge">⌁</div><div><div class="veh-name">我的通勤车</div><div class="veh-meta"><span class="online">● 在线</span>　最近更新 09:39</div></div><button class="text-button" data-action="车辆管理">车辆管理　↗</button></div>'+map()+'<div class="actions"><button class="action main" data-action="发光"><span class="icon">✳</span>发光找车</button><button class="action" data-action="响铃"><span class="icon">⌁</span>响铃</button></div><p class="hint">设备控制　·　当前为本地演示状态</p><section class="panel"><div class="panel-head"><strong>停放信息</strong><span>BIKE / 001</span></div><div class="rule"></div><div class="row"><div class="row-info"><div class="row-name">东侧停车区附近</div><div class="row-sub">停车位置描述</div></div><button class="row-action" data-action="步行导航">步行导航</button></div><div class="row"><div class="row-info"><div class="row-name">今天 08:42</div><div class="row-sub">停放时间</div></div><span class="counter">定位精度 ±8 m</span></div></section></div>'}
function rideView(){return '<div class="view"><div class="panel-head"><strong>今日骑行数据</strong><span>12 OCT / MON</span></div><div class="data-grid"><div class="data-box"><div><span class="value">12.8</span><span class="unit">KM</span></div><div class="caption">累计里程</div></div><div class="data-box"><div><span class="value">48</span><span class="unit">MIN</span></div><div class="caption">骑行时长</div></div><div class="data-box"><div><span class="value">16.0</span><span class="unit">KM/H</span></div><div class="caption">平均速度</div></div><div class="data-box"><div><span class="value">286</span><span class="unit">KCAL</span></div><div class="caption">消耗热量</div></div></div><div class="chart"><svg viewBox="0 0 330 72" preserveAspectRatio="none"><path d="M4 58 C35 53 43 45 72 51 S103 23 129 40 S160 18 186 31 S224 12 251 29 S287 8 326 17" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M4 58 C35 53 43 45 72 51 S103 23 129 40 S160 18 186 31 S224 12 251 29 S287 8 326 17 L326 72 L4 72Z" fill="var(--accent)" opacity=".1"/></svg></div><div class="ride-map">'+map()+'</div><div class="record '+(recording?'':'paused')+'"><div class="rec-left"><i class="rec-indicator"></i><span>'+(recording?'正在记录真实 GPS · 00:18:42':'今日记录已保存')+'</span></div><div class="record-buttons"><button class="tiny" data-action="暂停">'+(recording?'Ⅱ 暂停':'▶ 继续')+'</button><button class="tiny danger" data-action="结束记录">结束保存</button></div></div><section class="panel"><div class="panel-head"><strong>历史记录 / 路段</strong><span>查看全部　›</span></div><div class="row"><div class="row-info"><div class="row-name">第 1 段 · 4.2 km</div><div class="row-sub">配速 4′32″ / km</div></div><b class="counter">15.8 km/h</b></div><div class="row"><div class="row-info"><div class="row-name">第 2 段 · 3.6 km</div><div class="row-sub">配速 3′58″ / km</div></div><b class="counter">18.2 km/h</b></div></section><button class="action main" style="width:100%;margin-top:9px" data-action="开始记录">'+(recording?'正在记录':'＋　开始记录')+'</button></div>'}
function friendViewMarkup(){const tab=friendView;const data=tab==='好友'?[['林晓','好友 · 最近在线','LX'],['阿哲','好友 · 今天骑行 5.4 km','AZ'],['小满','好友 · 2 天前活跃','XM']]:tab==='好友请求'?[['陈一','想加你为好友','CY'],['Luna','想加你为好友','LU']]:[['林晓','09:32 擦肩 · 120 m','LX'],['阿哲','10:16 擦肩 · 260 m','AZ'],['小满','10:42 擦肩 · 430 m','XM']];return '<div class="view"><div class="panel-head"><strong>骑友联络网</strong><span>LOCAL NETWORK</span></div><div class="tabs">'+['附近的人','好友','好友请求'].map(x=>'<button class="'+(tab===x?'active':'')+'" data-friend-tab="'+x+'">'+x+(x==='好友请求'?'　02':'')+'</button>').join('')+'</div><section class="panel"><div class="panel-head"><strong>'+(tab==='好友请求'?'待处理申请':tab==='好友'?'好友列表':'今日擦肩记录')+'</strong><span>'+(tab==='好友'?'08 / 100':'SIMULATED')+'</span></div>'+data.map((d,i)=>'<div class="row"><div class="portrait">'+d[2]+'</div><div class="row-info"><div class="row-name">'+d[0]+'</div><div class="row-sub">'+d[1]+'</div></div>'+(tab==='好友请求'?'<button class="row-action" data-action="同意好友">同意</button><button class="tiny" data-action="忽略好友">忽略</button>':tab==='好友'?'<button class="row-action" data-action="聊天">聊天</button>':'<button class="row-action" data-action="加好友">＋ 添加</button>')+'</div>').join('')+'</section><p class="hint">本地演示骑友　·　附近数据只保存在当前设备</p></div>'}
function meView(){return '<div class="view"><div class="panel-head"><strong>骑行者档案</strong><span>PROFILE / 04</span></div><section class="profile"><div class="profile-head"><div class="profile-face">H</div><div><div class="profile-name">骑行中的阿青</div><div class="profile-meta">上海　/　通勤骑行者</div><div class="profile-meta">ID · 04-2817</div></div></div><div class="profile-stats"><div><b>348</b><span>累计公里</span></div><div><b>26</b><span>骑行天数</span></div><div><b>08</b><span>好友</span></div></div></section><section class="menu"><div class="menu-item" data-action="编辑资料"><span class="menu-icon">01</span>个人资料与头像<span class="arrow">↗</span></div><div class="menu-item" data-action="车辆管理"><span class="menu-icon">02</span>我的车辆<span class="arrow">↗</span></div><div class="menu-item" data-action="定位隐私"><span class="menu-icon">03</span>定位与隐私<span class="arrow">↗</span></div><div class="menu-item" data-action="备份恢复"><span class="menu-icon">04</span>数据备份 / 恢复<span class="arrow">↗</span></div></section><button class="action main" style="width:100%;margin-top:10px" data-action="编辑资料">编辑骑行者档案</button></div>'}
function contentFor(){return activeScreen==='find'?findView():activeScreen==='ride'?rideView():activeScreen==='friends'?friendViewMarkup():meView()}
function render(){const t=concepts.find(x=>x.id===activeTheme);document.getElementById('phone').className='phone theme-'+t.id;document.getElementById('module').textContent=screens.find(s=>s.id===activeScreen).module;document.getElementById('screen-title').textContent=activeScreen==='find'?'找车':activeScreen==='ride'?'骑行记录':activeScreen==='friends'?'骑友':'我的';document.getElementById('state-label').textContent=activeScreen==='find'?'信标在线':activeScreen==='ride'?(recording?'记录中':'今日已保存'):activeScreen==='friends'?'本地网络':'资料已同步';document.getElementById('content').innerHTML=contentFor();document.getElementById('content').scrollTop=0;document.getElementById('bottom').innerHTML=screens.map(s=>'<button data-screen="'+s.id+'" class="'+(s.id===activeScreen?'active':'')+'">'+icon(s.id)+s.label+'</button>').join('');document.getElementById('selector').innerHTML=concepts.map(c=>'<button data-theme="'+c.id+'" class="'+(activeTheme===c.id?'active':'')+'"><b>'+c.name+'</b><small>'+c.tag+'</small></button>').join('');document.getElementById('page-switch').innerHTML=screens.map(s=>'<button data-screen="'+s.id+'" class="'+(activeScreen===s.id?'active':'')+'">'+s.label+'</button>').join('');document.getElementById('design-title').textContent=t.title+' · '+t.code;document.getElementById('design-desc').textContent=t.desc;document.getElementById('palette').innerHTML=t.colors.map(c=>'<i style="background:'+c+'"></i>').join('');document.getElementById('swatch-note').textContent=t.colors.join('　');document.getElementById('design-code').textContent=t.code;document.getElementById('points').innerHTML=t.points.map(x=>'<li>'+x+'</li>').join('')}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),1600)}
document.addEventListener('click',e=>{const theme=e.target.closest('[data-theme]');if(theme){activeTheme=theme.dataset.theme;render();return}const screen=e.target.closest('[data-screen]');if(screen){activeScreen=screen.dataset.screen;render();return}const ft=e.target.closest('[data-friend-tab]');if(ft){friendView=ft.dataset.friendTab;render();return}const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;if(a==='开始记录'){recording=!recording;render();notify(recording?'GPS 骑行记录已开始':'记录状态已更新')}else if(a==='暂停'){recording=!recording;render();notify(recording?'继续记录':'已暂停记录')}else if(a==='结束记录'){recording=false;render();notify('本次骑行已保存')}else if(a==='发光')notify('已模拟亮灯 8 秒');else if(a==='响铃')notify('已模拟响铃 3 次');else if(a==='加好友')notify('好友请求已发送');else if(a==='同意好友')notify('已添加为好友');else if(a==='忽略好友')notify('已忽略好友请求');else if(a==='刷新位置')notify('正在更新车辆位置…');else if(a==='定位车辆')notify('地图已定位到车辆');else if(a==='地图缩放')notify('地图比例已调整');else notify(a+'面板已打开')}});
render();
</script></body></html>
